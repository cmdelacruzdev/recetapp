<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>RecetAPP - Sin conexión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .offline-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(26, 26, 26, 0.08);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; fill: white; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; color: #1a1a1a; }
    p { font-size: 0.95rem; color: #636363; line-height: 1.4; margin-bottom: 1.5rem; }
    .btn-retry {
      display: inline-block;
      background: #0d6efd;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-retry:hover { background: #0b5ed7; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M24 8.98C20.93 5.9 16.69 4 12 4 9.08 4 6.37 4.8 4 6.23L12 16l12-7.02zM1.41 1.58L0 3l2.03 2.03C.78 6.06 0 7.46 0 9.05v.15L12 20l3-3-3.54-3.54L12 9.87 2.34 1.58h-.93z" fill="#fff"/></svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Comprueba tu red y vuelve a intentarlo.</p>
    <button class="btn-retry" onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
