<router-outlet />
<app-toast />
<app-confirm-dialog />

@if (pwaInstallService.showIOSModal()) {
<div class="modal-overlay d-flex align-items-end justify-content-center p-3 fade-in"
  style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;
         background: rgba(0,0,0,0.7); z-index: 9999;"
  (click)="pwaInstallService.closeModal()">

  <div class="bg-white w-100 rounded-4 p-4 text-center shadow-lg"
    style="max-width: 400px; margin-bottom: 20px;"
    (click)="$event.stopPropagation()">

    <div class="mb-3 text-dark">
      <i class="bi bi-apple display-4"></i>
    </div>
    <h4 class="fw-bold mb-3">Instalar en iOS</h4>
    <div class="text-muted small mb-4 text-start">
      <p>Para instalar la app en tu dispositivo Apple, sigue estos 2 pasos:</p>
      <p class="mb-2">
        <strong>1.</strong> Toca el botón <strong>Compartir</strong>
        <i class="bi bi-box-arrow-up border rounded px-1 bg-light"></i>
        en la barra del navegador.
      </p>
      <p>
        <strong>2.</strong> Desliza hacia abajo el menú y selecciona
        <strong>"Añadir a la pantalla de inicio"</strong>
        <i class="bi bi-plus-square border rounded px-1 bg-light"></i>.
      </p>
    </div>
    <button class="btn btn-primary w-100 rounded-pill py-1 fw-bold"
      (click)="pwaInstallService.closeModal()">Cerrar</button>
  </div>
</div>
}
