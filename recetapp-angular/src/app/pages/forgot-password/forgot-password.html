<main class="form-signin w-100 m-auto d-flex align-items-center py-4"
    style="height: 100vh; max-width: 330px; padding: 15px;">
    <form (ngSubmit)="handleSubmit()" class="w-100">
        <div class="text-center mb-3">
            <img src="icons/android-chrome-192x192.png" alt="RecetAPP" class="app-logo" />
        </div>
        <h1 class="h4 mb-3 fw-bold text-center">RecetAPP</h1>

        @if (submitted) {
        <div class="alert alert-success">
            Si el email existe en nuestro sistema, recibirás un enlace para restablecer tu contraseña.
        </div>
        <a routerLink="/login" class="w-100 btn btn-primary mb-3">Volver al login</a>
        } @else {
        <h5 class="mb-3 text-center">¿Olvidaste tu contraseña?</h5>
        <p class="text-muted small text-center mb-3">Introduce tu email y te enviaremos un enlace para restablecerla.</p>

        @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <div class="form-floating input-with-icon mb-3">
            <i class="bi bi-envelope"></i>
            <input type="email" class="form-control" id="email" placeholder="Correo" [(ngModel)]="email"
                name="email" autocomplete="email" required>
            <label for="email">Correo Electrónico</label>
        </div>

        <button class="w-100 btn btn-lg btn-primary mb-3" type="submit">Enviar enlace</button>
        <a routerLink="/login" class="w-100 btn btn-outline-secondary btn-sm">Volver al login</a>
        }
    </form>
</main>
