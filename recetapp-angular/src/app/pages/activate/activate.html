<main class="form-signin w-100 m-auto d-flex align-items-center py-2"
    style="min-height: 100vh; min-height: 100dvh; max-width: 350px; padding: 12px;">
    <form (ngSubmit)="handleActivate()" class="w-100" novalidate>
        <div class="text-center mb-2">
            <img src="recetapp_logo_transparente.png" alt="RecetAPP" class="app-logo-transparente" />
        </div>
        <h1 class="h5 mb-1 fw-bold text-center">Activa tu cuenta</h1>
        <p class="text-muted small text-center mb-2">
            Completa tus datos para unirte a la casa que te ha invitado.
        </p>

        @if (errorMessage) {
        <div class="alert alert-danger py-1">{{ errorMessage }}</div>
        }

        <div class="mb-2">
            <label for="email" class="form-label">Usuario (tu correo)</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="Correo"
                    [ngModel]="email" name="email" readonly disabled autocomplete="username">
            </div>
        </div>
        <div class="mb-2">
            <label for="nombre" class="form-label">Tu Nombre</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre" placeholder="Tu Nombre"
                    [(ngModel)]="nombre" name="nombre" autocomplete="name" required>
            </div>
        </div>
        <div class="mb-2">
            <label for="tempPassword" class="form-label">Contraseña temporal (del correo)</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" id="tempPassword" placeholder="Contraseña temporal"
                    [(ngModel)]="tempPassword" name="tempPassword" autocomplete="off" required>
            </div>
        </div>
        <div class="mb-2">
            <label for="newPassword" class="form-label">Nueva contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="newPassword" placeholder="Nueva contraseña"
                    [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password" required>
            </div>
        </div>
        <div class="mb-2">
            <label for="confirmPassword" class="form-label">Repite nueva contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repite nueva contraseña"
                    [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
            </div>
        </div>

        <button class="w-100 btn btn-primary mb-2" type="submit" [disabled]="!token || !email">
            Activar cuenta
        </button>
        <a routerLink="/login" class="w-100 btn btn-outline-secondary btn-sm">Volver al login</a>
    </form>
</main>
