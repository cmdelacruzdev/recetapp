<main class="form-signin w-100 m-auto d-flex align-items-center py-4"
    style="height: 100vh; max-width: 330px; padding: 15px;">
    <form (ngSubmit)="handleSubmit()" class="w-100">
        <div class="text-center mb-3">
            <img src="icons/android-chrome-192x192.png" alt="RecetAPP" class="app-logo" />
        </div>
        <h1 class="h4 mb-3 fw-bold text-center">RecetAPP</h1>

        @if (submitted) {
        <div class="alert alert-success">
            Contraseña restablecida correctamente.
        </div>
        <a routerLink="/login" class="w-100 btn btn-primary mb-3">Ir al login</a>
        } @else {
        <h5 class="mb-3 text-center">Nueva contraseña</h5>

        @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <div class="mb-3">
            <label for="password" class="form-label">Nueva contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Nueva contraseña"
                    [(ngModel)]="password" name="password" autocomplete="new-password" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmar contraseña"
                    [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
            </div>
        </div>

        <button class="w-100 btn btn-lg btn-primary mb-3" type="submit" [disabled]="!token">Restablecer</button>
        <a routerLink="/login" class="w-100 btn btn-outline-secondary btn-sm">Volver al login</a>
        }
    </form>
</main>
