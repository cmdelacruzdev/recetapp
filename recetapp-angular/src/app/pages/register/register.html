<main class="form-signin w-100 m-auto d-flex align-items-center py-4"
    style="height: 100vh; max-width: 350px; padding: 15px;">
    <form (ngSubmit)="handleRegister()" class="w-100" novalidate>
        <div class="text-center mb-3">
            <img src="recetapp_logo_transparente.png" alt="RecetAPP" class="app-logo-transparente" />
        </div>
        <h1 class="h4 mb-3 fw-bold text-center">Crear Cuenta</h1>
        @if (errorMessage) {
        <div class="alert alert-danger">Error al registrar usuario. {{ errorMessage }}</div>
        }

        <div class="mb-3">
            <label for="nombre" class="form-label">Tu Nombre</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre" placeholder="Tu Nombre" [(ngModel)]="nombre"
                    name="nombre" autocomplete="name" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="nombreCasa" class="form-label">Nombre de tu Casa (Familia/Piso)</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-house-door"></i></span>
                <input type="text" class="form-control" id="nombreCasa" placeholder="Nombre de la Casa"
                    [(ngModel)]="nombreCasa" name="nombreCasa" maxlength="25" autocomplete="organization" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="usuario" class="form-label">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="usuario" placeholder="Correo" [(ngModel)]="usuario"
                    name="usuario" autocomplete="email" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Contraseña" [(ngModel)]="password"
                    name="password" autocomplete="new-password" required>
            </div>
        </div>

        <button class="w-100 btn btn-lg btn-primary mb-3" type="submit">Registrarse</button>
        <a routerLink="/login" class="w-100 btn btn-outline-secondary btn-sm">Ya tengo cuenta</a>
    </form>
</main>
